apiVersion: batch/v1
kind: Job
metadata:
    name: symfony-db-migrate
    namespace: portfoliov3-api
spec:
    backoffLimit: 3
    template:
        spec:
            serviceAccountName: default
            restartPolicy: Never
            containers:
                - name: migrate
                  image: joanisky/portfoliov3-api:latest
                  command:
                      - /bin/sh
                      - -c
                      - |
                          set -e
                          echo "Waiting for MariaDB..."
                          for i in {1..30}; do
                            if nc -z mariadb 3306 2>/dev/null; then
                              echo "MariaDB is ready!"
                              break
                            fi
                            sleep 2
                          done

                          php bin/console doctrine:database:create --if-not-exists --env=prod || true
                          php bin/console doctrine:schema:update --force --env=prod
                          echo "Migrations completed!"
                  envFrom:
                      - secretRef:
                            name: symfony-env
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "50m"
                      limits:
                          memory: "256Mi"
                          cpu: "100m"
