apiVersion: v1
kind: ConfigMap
metadata:
    name: symfony-api-config
    namespace: portfoliov3-api
data:
    APP_ENV: "prod"
    APP_DEBUG: "0"

    SESSION_COOKIE_DOMAIN: ".jonathanlore.fr"
    SESSION_COOKIE_SECURE: "true"
    SESSION_COOKIE_SAMESITE: "lax"

    CORS_ALLOW_ORIGIN: "^https://(www\\.)?jonathanlore\\.fr$"

    FRONTEND_URL: "https://jonathanlore.fr"
    API_URL: "https://api.jonathanlore.fr"
